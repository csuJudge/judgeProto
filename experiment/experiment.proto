syntax            = "proto3";
option go_package = "github.com/csuJudge/judgeProto/experiment";

package oj.experiment;

service ExperimentServer {
  // AddKeyAction 添加击键行为
  rpc AddKeyAction(AddKeyActionReq) returns (CommonRsp) {}
  // AddInteraction 添加交互行为（鼠标/滚动/选区/焦点）
  rpc AddInteraction(AddInteractionReq) returns (CommonRsp) {}
  // AddKeyActionSegment 添加未提交的击键段（学生关标签页时补发）
  rpc AddKeyActionSegment(AddKeyActionSegmentReq) returns (CommonRsp) {}
  // AddCode 添加代码
  rpc AddCode(AddCodeReq) returns (CommonRsp) {}
  // QueryCode 查询代码
  rpc QueryCode(QueryCodeReq) returns (QueryCodeRsp) {}
  // QueryMyCodeList 查询我的代码列表
  rpc QueryMyCodeList(QueryMyCodeListReq)returns(QueryMyCodeListRsp){}
}

message QueryMyCodeListReq{
  int32 page = 1; // 页
  int32 limit = 2; // 页大小
  int32 userID = 3; // 用户编号
  int32 problemID = 4; // 题目编号
}

message CommonRsp {
  string message = 1;  // 返回信息
  int32 code     = 2;  // 返回码
}

message AddCodeReq{
  int32 problemID = 1; // 题目编号
  string code = 2; // 代码
  int32 userID = 3; // 用户编号
  int32 codeType = 4;  // 代码类型
  string  fileName = 5; // 代码名称
  int32 solutionType = 6; // 提交类型
  string remoteIP = 7; // 提交IP
  int32 addType = 8; // 提交类型
}

message QueryCodeReq{
  int32 problemID = 1; // 题目编号
  int32 userID = 2; // 用户编号
}

message QueryCodeRsp{
  string message = 1;  // 返回信息
  int32 code     = 2;  // 返回码
  Code userCode = 3; // 代码
}

message AddKeyActionReq{
  string action = 1; // 击键行为
  int32 solutionID = 2; // 提交编号
  string startTime = 3; // 开始时间
  int32 problemID = 4; // 题目编号
  int32 userID = 5; // 用户编号
  int32 solutionType = 6; // 提交类型
  string remoteIP = 7; // 提交IP
}

message AddInteractionReq{
  string action = 1; // 交互行为（JSON 数组字符串）
  string sessionKey = 2; // 页面会话标识，刷新会换；多标签页靠它区分
  int32 batchIndex = 3; // 同一会话内第几批，从 1 开始
  string flushReason = 4; // timer / pagehide / submit / test / compile / judge
  int32 eventCount = 5; // 本批事件条数
  string startTime = 6; // 页面加载时刻
  int32 problemID = 7; // 题目编号
  int32 solutionID = 8; // 提交编号；定时批与补发批为 0
  int32 userID = 9; // 用户编号
  string workID = 10; // 跨页面加载的同一次投入
  int32 resumed = 11; // 1 = 这次页面加载是接着上次回来的
  int32 gapBeforeS = 12; // 距上一次活动的秒数
  string remoteIP = 13; // 提交IP
}

message AddKeyActionSegmentReq{
  string action = 1; // 击键行为
  string startTime = 2; // 页面加载时刻
  int32 problemID = 3; // 题目编号
  int32 userID = 4; // 用户编号
  string workID = 5; // 跨页面加载的同一次投入
  int32 resumed = 6; // 1 = 这次页面加载是接着上次回来的
  int32 gapBeforeS = 7; // 距上一次活动的秒数
  string remoteIP = 8; // 提交IP
}

message Code{
  int32 Language = 1; // 语言
  string Code = 2; // 代码
  int32 addType = 3; // 添加的类型
  string createdTime = 4; // 创建的时间
}

message QueryMyCodeListRsp{
  string message = 1;  // 返回信息
  int32 code     = 2;  // 返回码
  repeated Code userCode = 3; // 代码
  int32 total = 4; // 总数
}