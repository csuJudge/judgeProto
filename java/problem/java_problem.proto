syntax            = "proto3";
option go_package = "github.com/csuJudge/judgeProto/java/javaProblem";

package oj.java.problem;


service ProblemServer {
  // QueryProblem 查询题目
  rpc QueryProblem(QueryProblemReq) returns (QueryProblemRsp) {}
  // AddProblem 添加题目
  rpc AddProblem(AddProblemReq) returns (CommonRsp) {}
  // UpdateProblem 更新题目
  rpc UpdateProblem(UpdateProblemReq) returns (CommonRsp) {}
  // UpdateProblemStatus 更新题目状态
  rpc UpdateProblemStatus(UpdateProblemStatusReq) returns (CommonRsp) {}
  // QueryProblemList 查询题目列表
  rpc QueryProblemList(QueryProblemListReq) returns (QueryProblemListRsp) {}
  // QueryAllProblem 查询所有题目列表
  rpc QueryAllProblem(QueryProblemListReq) returns (QueryAllProblemRsp) {}
  // QueryProblemName 查询题目名称
  rpc QueryProblemName(QueryProblemNameReq) returns (QueryAllProblemRsp) {}
}

message Problem {
  int32 id = 1; // 题目编号
  int32 type = 2; // 类型
  string title = 3; // 题目名称
  string description = 4; // 题目描述
  string inputDescription = 5; // 输入描述
  string outputDescription = 6; // 输出描述
  int32 totalPoints = 7; // 满分
  int32 timeLimit = 8; // 时间上限
  int32 memoryLimit = 9; // 内存上限
  int32 jdkVersion = 10; // jdk版本
  string oopJSON = 11; // OOP特性检查项
  int32 enable = 12; // 状态
  string createdTime = 13; // 创建时间
  string updatedTime = 14; // 更新时间
  int32 solved = 15; // 解决数
  int32 submission = 16; // 提交数
}

message QueryProblemNameReq{
  int32 userID = 1;  // 用户编号
}

message QueryAllProblemRsp{
  string message           = 1;  // 返回信息
  int32 code               = 2;  // 返回码
  repeated Problem problem = 3;  // 问题列表
  int32 total              = 4;  // 总数
}

message UpdateProblemStatusReq{
  int32 userID    = 1;  // 用户主键
  int32 problemID = 2;  // 题目主键
  int32 status    = 3;  // 状态
}

message UpdateProblemReq{
  int32 problemID = 1; // 题目编号
  int32 type = 2; // 类型
  string title = 3; // 题目名称
  string description = 4; // 题目描述
  string inputDescription = 5; // 输入描述
  string outputDescription = 6; // 输出描述
  int32 totalPoints = 7; // 满分
  int32 timeLimit = 8; // 时间上限
  int32 memoryLimit = 9; // 内存上限
  int32 jdkVersion = 10; // jdk版本
  string oopJSON = 11; // OOP特性检查项
  int32 enable = 12; // 状态
  int32 updater = 13; // 更新时间
}

message QueryProblemListReq{
  int32 page       = 1;  // 页
  int32 limit      = 2;  // 页大小
  int32 userID     = 3;  // 用户编号
  string condition = 4;  // 条件（名称或者编号）
  string knowledge = 5;  // 知识点
  string course    = 6;  // 课程
  int32 difficulty = 7; // 难度
}

message ProblemList {
  int32 problemID  = 1;  // 题目编号
  string name      = 2;  // 题目名称
  int32 solved     = 3;  // 解决数
  int32 submission = 4;  // 提交数
  int32 difficulty = 5;  // 难度
  float passRate   = 6;  // 通过率
  int32 isDone     = 7;  // 是否做完
  string knowledge = 8; // 知识点
}

message QueryProblemListRsp{
  string message               = 1;  // 返回信息
  int32 code                   = 2;  // 返回码
  repeated ProblemList problem = 3;  // 问题列表
  int32 total                  = 4;  // 总数
}

message QueryProblemReq{
  int32 problemID = 1;  // 问题编号
  int32 userID    = 2;  // 用户编号
  int32 contestID = 3;  // 作业编号
}

message QueryProblemRsp{
  string message  = 1;  // 返回信息
  int32 code      = 2;  // 返回码
  Problem problem = 3;  // 问题
}

message AddProblemReq{
  int32 type = 1; // 类型
  string title = 2; // 题目名称
  string description = 3; // 题目描述
  string inputDescription = 4; // 输入描述
  string outputDescription = 5; // 输出描述
  int32 totalPoints = 6; // 满分
  int32 timeLimit = 7; // 时间上限
  int32 memoryLimit = 8; // 内存上限
  int32 jdkVersion = 9; // jdk版本
  string oopJSON = 10; // OOP特性检查项
  int32 enable = 11; // 状态
  string creator = 12; // 创建时间
}

message CommonRsp{
  string message = 1;  // 返回信息
  int32 code     = 2;  // 返回码
}