syntax            = "proto3";
option go_package = "github.com/csuJudge/judgeProto/knowledge";

package oj.knowledge;

service KnowledgeServer {
    // QueryKnowledge 查询知识点
    rpc QueryKnowledge(UserIDReq) returns (QueryKnowledgeRsp) {}
    // AddKnowledge 添加知识点
    rpc AddKnowledge(AddKnowledgeReq) returns (CommonRsp) {}
    // QueryProblemKnowledge 查询题目的知识点
    rpc QueryProblemKnowledge(QueryProblemKnowledgeReq) returns (QueryProblemKnowledgeRsp) {}
    // QueryAllProblemKnowledge 查询题目所有的知识点
    rpc QueryAllProblemKnowledge(QueryProblemKnowledgeReq) returns (QueryProblemKnowledgeRsp) {}
    // UpdateKnowledge 更新知识点
    rpc UpdateKnowledge(UpdateKnowledgeReq) returns (CommonRsp) {}
    // UpdateKnowledgeStatus 更新知识点状态
    rpc UpdateKnowledgeStatus(UpdateKnowledgeStatusReq) returns (CommonRsp) {}
    // UpdateKnowledgeWeight 更新知识点优先级
    rpc UpdateKnowledgeWeight(UpdateKnowledgeWeightReq) returns (CommonRsp) {}
    // QueryKnowledgePageSize 查询知识点
    rpc QueryKnowledgePageSize(QueryKnowledgePageSizeReq) returns (QueryKnowledgeRsp) {}
    // QueryContestKnowledge 查询课程的知识点
    rpc QueryCourseKnowledge(QueryCourseKnowledgeReq) returns (QueryKnowledgeRsp) {}
    // UpdateCourseKnowledgeReq 更新课程的知识点
    rpc UpdateCourseKnowledge(UpdateCourseKnowledgeReq) returns (CommonRsp) {}
    // QueryMyMastery 查询我的知识点掌握度（BKT 知识追踪）
    rpc QueryMyMastery(QueryMyMasteryReq) returns (QueryMyMasteryRsp) {}
    // QueryClassMastery 查询班级知识点掌握度热力图
    rpc QueryClassMastery(QueryClassMasteryReq) returns (QueryClassMasteryRsp) {}
    // ===== 知识讲解内容（v2.7.5 新增，只做追加） =====
    rpc QueryContentCourses(QueryContentCoursesReq) returns (QueryContentCoursesRsp) {}
    rpc QueryContentChapter(QueryContentChapterReq) returns (QueryContentChapterRsp) {}
    rpc QueryContentTopic(QueryContentTopicReq) returns (QueryContentTopicRsp) {}
    rpc SaveContentCourse(SaveContentCourseReq) returns (CommonRsp) {}
    rpc SaveContentChapter(SaveContentChapterReq) returns (CommonRsp) {}
    rpc SaveContentTopic(SaveContentTopicReq) returns (CommonRsp) {}
    rpc UpdateContentStatus(UpdateContentStatusReq) returns (CommonRsp) {}
    rpc MoveContent(MoveContentReq) returns (CommonRsp) {}
}

message UpdateCourseKnowledgeReq{
    int32 courseID = 1;  // 课程编号
    int32 userID    = 2;  // 用户编号
    string knowledgeIDs = 3; // 知识点编号
    int32 platform = 4;  // 注写平台
}

message QueryCourseKnowledgeReq{
    string courseIDs = 1;  // 课程编号
    int32 userID    = 2;  // 用户编号
    int32 platform = 3;  // 注写平台
}

message UserIDReq {
    int32 userID = 1;  // 用户编号
    int32 platform = 2;  // 注写平台
}

message UpdateKnowledgeWeightReq {
    int32 userID      = 1;  // 用户主键
    int32 knowledgeID = 2;  // 知识点主键
    int32 moveType    = 3;  // 类型
    int32 weight      = 4;  // 权重
    int32 platform = 5;  // 注写平台
}

message UpdateKnowledgeStatusReq {
    int32 userID      = 1;  // 用户主键
    int32 knowledgeID = 2;  // 知识点主键
    int32 status      = 3;  // 状态
    int32 platform = 4;  // 注写平台
}

message UpdateKnowledgeReq {
    int32 knowledgeID = 1;  // 知识点主键
    string name       = 2;  // 知识点名称
    int32 userID      = 3;  // 用户主键
    int32 platform = 4;  // 注写平台
}

message QueryKnowledgePageSizeReq {
    int32 page   = 1;  // 页
    int32 limit  = 2;  // 页大小
    int32 userID = 3;  // 用户编号
    int32 platform = 4;  // 注写平台
}

message QueryKnowledgeRsp {
    string message               = 1;  // 返回信息
    int32 code                   = 2;  // 返回码
    repeated Knowledge knowledge = 3;  // 知识点
    int32 total                  = 4;  // 总数
}

message AddKnowledgeReq {
    string name  = 1;  // 知识点名称
    int32 userID = 2;  // 用户主键
    int32 platform = 3;  // 注写平台
}

message CommonRsp {
    string message = 1;  // 返回信息
    int32 code     = 2;  // 返回码
}

message QueryProblemKnowledgeReq {
    int32 problemID = 1;  // 问题编号
    int32 userID    = 2;  // 用户编号
    int32 platform = 3;  // 注写平台
}

message QueryProblemKnowledgeRsp {
    string message    = 1;  // 返回信息
    int32 code        = 2;  // 返回码
    repeated Knowledge knowledges = 3;  // 知识点的字符串集合
}

message Knowledge {
    int32 id          = 1;  // 知识点主键
    string name       = 2;  // 知识点名称
    string creator    = 3;  // 创建者
    string createTime = 4;  // 创建时间
    int32 enable      = 5;  // 状态
    int32 weight      = 6;  // 权重
}

// ========== 知识点掌握度（BKT 知识追踪；数据由 oj_index_daemon 离线计算，落 user_knowledge_mastery 表） ==========

message QueryMyMasteryReq {
    int32 userID = 1;  // 用户编号
    int32 platform = 2;  // 注写平台
}

message MyMasteryPoint {
    int32  knowledgeID = 1;  // 知识点编号
    string name        = 2;  // 知识点名称
    double mastery     = 3;  // BKT 掌握概率（0~1）
    int32  tryCount    = 4;  // 尝试次数
    int32  acCount     = 5;  // AC 次数
    double acRate      = 6;  // AC 率（百分比）
    string lastTime    = 7;  // 最近一次提交时间
    string level       = 8;  // weak | learning | mastered
}

message QueryMyMasteryRsp {
    string message           = 1;  // 返回信息
    int32 code               = 2;  // 返回码
    repeated MyMasteryPoint points = 3;  // 我的知识点掌握度（按掌握度升序）
}

message QueryClassMasteryReq {
    int32 classID = 1;  // 班级编号
    int32 platform = 2;  // 注写平台
}

message ClassMasteryKP {
    int32 knowledgeID  = 1;  // 知识点编号
    string name         = 2;  // 知识点名称
    double classAvg     = 3;  // 班级平均掌握度（仅统计有数据的学生）
    int32 coveredUsers = 4;  // 有数据的学生数
    int32 weakUsers    = 5;  // 薄弱学生数
}

message ClassMasteryUser {
    int32  userID     = 1;  // 用户编号
    string userName   = 2;  // 用户名
    string userNumber = 3;  // 学号
    repeated double matrix = 4;  // 与 knowledgePoints 顺序对齐，-1 表示该学生无此知识点数据
}

message QueryClassMasteryRsp {
    string message             = 1;  // 返回信息
    int32 code                 = 2;  // 返回码
    int32 classID              = 3;  // 班级编号
    repeated ClassMasteryKP knowledgePoints = 4;  // 知识点列（按编号升序）
    repeated ClassMasteryUser users         = 5;  // 学生行
}

message QueryContentCoursesReq {
    int32 userID = 1;  // 登录用户编号（仅日志/trace）
    int32 includeDisabled = 2;  // 1 表示包含停用项（管理端），0 仅启用项
}

message ContentTopicSkeleton {
    int32 id           = 1;  // 小节主键
    string title       = 2;  // 小节标题
    string summary     = 3;  // 一句话摘要
    int32 sortOrder    = 4;  // 排序
    bool hasCode       = 5;  // 是否含代码块
    string animation   = 6;  // 动画 key，空串表示无动画
}

message ContentChapter {
    int32 id                = 1;  // 章节主键
    int32 contentCourseID   = 2;  // 所属讲解课程主键
    string title            = 3;  // 章节标题
    string icon             = 4;  // 图标名
    string color            = 5;  // 主题色
    int32 sortOrder         = 6;  // 排序
    repeated ContentTopicSkeleton topics = 7;  // 小节骨架
    int32 enable            = 8;  // 1 启用 0 停用 -1 删除
}

message ContentCourse {
    int32 id                 = 1;  // 讲解课程主键
    int32 courseID           = 2;  // 平台课程 course.id，0 表示未挂钩
    string name              = 3;  // 课程名
    string slug              = 4;  // 英文标识
    string description       = 5;  // 课程描述
    string icon              = 6;  // 图标名
    string color             = 7;  // 主题色
    int32 totalTopics        = 8;  // 小节总数
    int32 sortOrder          = 9;  // 排序
    repeated ContentChapter chapters = 10;  // 章节
    int32 enable             = 11;  // 1 启用 0 停用 -1 删除
}

message QueryContentCoursesRsp {
    string message                = 1;
    int32 code                    = 2;
    repeated ContentCourse courses = 3;
}

message ContentTopic {
    int32 id            = 1;  // 小节主键
    int32 chapterID     = 2;  // 所属章节主键
    string title        = 3;  // 小节标题
    string summary      = 4;  // 摘要
    repeated string details = 5;  // 讲解要点
    string code         = 6;  // 示例代码
    string animation    = 7;  // 动画 key，空串表示无动画
    repeated string tips = 8;  // 提示
    int32 sortOrder     = 9;  // 排序
    int32 enable        = 10;  // 1 启用 0 停用 -1 删除
}

message QueryContentChapterReq {
    int32 chapterID = 1;
}

message QueryContentChapterRsp {
    string message            = 1;
    int32 code                = 2;
    ContentChapter chapter    = 3;
    repeated ContentTopic topics = 4;
}

message QueryContentTopicReq {
    int32 topicID = 1;
}

message QueryContentTopicRsp {
    string message     = 1;
    int32 code         = 2;
    ContentTopic topic = 3;
}

message SaveContentCourseReq {
    int32 id            = 1;  // 0 表示新增
    int32 courseID      = 2;  // 平台课程编号
    string name         = 3;
    string slug         = 4;
    string description  = 5;
    string icon         = 6;
    string color        = 7;
    int32 sortOrder     = 8;
    int32 userID        = 9;
}

message SaveContentChapterReq {
    int32 id                = 1;  // 0 表示新增
    int32 contentCourseID   = 2;
    string title            = 3;
    string icon             = 4;
    string color            = 5;
    int32 sortOrder         = 6;
    int32 userID            = 7;
}

message SaveContentTopicReq {
    int32 id            = 1;  // 0 表示新增
    int32 chapterID     = 2;
    string title        = 3;
    string summary      = 4;
    repeated string details = 5;
    string code         = 6;
    string animation    = 7;
    repeated string tips = 8;
    int32 sortOrder     = 9;
    int32 userID        = 10;
}

message UpdateContentStatusReq {
    int32 id      = 1;
    int32 level   = 2;  // 1 课程 2 章节 3 小节
    int32 enable  = 3;  // 1 启用 0 停用 -1 删除
    int32 userID  = 4;
}

message MoveContentReq {
    int32 id         = 1;
    int32 level      = 2;  // 1 课程 2 章节 3 小节
    int32 direction  = 3;  // 1 上移 2 下移
    int32 userID     = 4;
}
